name: Build & Release APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Stage APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "wheelshot.apk"
          ls -lh wheelshot.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheelshot-apk
          path: wheelshot.apk
          if-no-files-found: error

      - name: Resolve release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=WheelShot ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            short="${GITHUB_SHA::7}"
            echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "name=WheelShot build ${GITHUB_RUN_NUMBER} (${short})" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          # Stable, not a prerelease, so /releases/latest is this build
          # and the repo Releases link opens on the APK.
          prerelease: false
          make_latest: true
          body: |
            ### Download

            [wheelshot.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/wheelshot.apk)

            Install on Android. Allow unknown sources if the phone asks.
          files: wheelshot.apk
          fail_on_unmatched_files: true
