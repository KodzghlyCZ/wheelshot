name: Build & Release APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Dependencies
        run: flutter pub get

      # Same keystore every build, or Android refuses to install the new APK
      # over the old one. Create once, then:
      #   gh secret set ANDROID_KEYSTORE_BASE64 < upload-keystore.jks.b64
      #   gh secret set ANDROID_KEYSTORE_PASSWORD
      #   gh secret set ANDROID_KEY_ALIAS
      #   gh secret set ANDROID_KEY_PASSWORD
      - name: Release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret. APK is debug-signed and will not update in place."
          fi

      - name: Build release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Stage APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "wheelshot.apk"
          ls -lh wheelshot.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheelshot-apk
          path: wheelshot.apk
          if-no-files-found: error

      - name: Resolve release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=WheelShot ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            short="${GITHUB_SHA::7}"
            echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "name=WheelShot build ${GITHUB_RUN_NUMBER} (${short})" >> "$GITHUB_OUTPUT"
          fi
          ver=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          # Stable, not a prerelease, so /releases/latest is this build
          # and the repo Releases link opens on the APK.
          prerelease: false
          make_latest: true
          body: |
            version: ${{ steps.meta.outputs.version }}

            ### Download

            [wheelshot.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/wheelshot.apk)

            Install on Android. Allow unknown sources if the phone asks.
          files: wheelshot.apk
          fail_on_unmatched_files: true
