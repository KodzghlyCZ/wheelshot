name: wheelshot
description: Guided tire and rim photo capture for inventory / sale docs.
publish_to: "none"
version: 1.1.1+3

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  # Camera2, vendored so stills use the full sensor field of view.
  # See third_party/camera_android/VENDORED.md.
  camera_android:
    path: third_party/camera_android
  path: ^1.9.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  intl: ^0.19.0
  native_device_orientation: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/karlos.png
