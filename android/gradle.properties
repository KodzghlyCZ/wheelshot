# Cap the build JVM. 4G heap + 2G metaspace plus the Kotlin daemon
# exhausted the machine and the build died with OOM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
android.enableJetifier=true
# Opt out of AGP 9-only new DSL until Flutter fully supports it.
android.newDsl=false
android.builtInKotlin=false
